<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
{% feed_meta %}
<meta name="theme-color" content="#F5F5F5">
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="alternate" type="text/plain" title="llms.txt" href="{{ '/llms.txt' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/blog.css' | relative_url }}">
</head>
<body>
<header class="menubar">
  <nav aria-label="primary">
    <a href="{{ '/' | relative_url }}">agustín</a>
    <a href="{{ '/#work' | relative_url }}">work</a>
    <a href="{{ '/#resume' | relative_url }}">résumé</a>
    <a href="{{ '/blog/' | relative_url }}" aria-current="{% if page.url contains '/blog/' %}page{% endif %}">blog</a>
    <a href="{{ '/#faq' | relative_url }}">faq</a>
  </nav>
  <a href="{{ '/' | relative_url }}" aria-label="home">
    <svg class="glyph" viewBox="0 0 30 20" aria-hidden="true"><path d="M2 16 9 5l5 8M15 13l6-9 7 12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  <div class="status"><a class="cta" href="mailto:{{ site.author.email }}">say hi</a></div>
</header>

<main class="page">
{{ content }}
</main>

<footer class="end">
  <nav aria-label="footer">
    <a href="{{ '/' | relative_url }}">home</a>
    <a href="{{ '/blog/' | relative_url }}">blog</a>
    <a href="{{ '/blog/feed.xml' | relative_url }}">rss</a>
    <a href="{{ '/llms.txt' | relative_url }}">llms.txt</a>
    <a href="https://github.com/agustindelmonti" rel="me">github</a>
    <a href="https://www.linkedin.com/in/agustin-delmonti/" rel="me">linkedin</a>
    <a href="https://x.com/agus_delmo" rel="me">x</a>
  </nav>
  <p>rosario, argentina · {{ site.time | date: '%Y' }}</p>
</footer>
</body>
</html>
